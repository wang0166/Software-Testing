name: Pandora CI

on:
  push:
    branches:
      - devops/docker
  pull_request:
    branches:
      - devops/docker
  workflow_dispatch:

jobs:
  backend:
    name: Backend Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Test backend
        run: mvn -B test

      - name: Package backend
        run: mvn -B -DskipTests package

  web:
    name: Web Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: pandora_web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pandora_web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build web
        run: npm run build

  docker:
    name: Docker Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pandora
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: ci_test_password
          ADMIN_INIT_PASSWORD: ci_admin_password
        run: docker compose config

      - name: Build backend image
        run: docker compose build backend

      - name: Build web image
        run: docker compose build web