name: Pandora CI

on:
  push:
    branches:
      - devops/docker

  pull_request:
    branches:
      - devops/docker

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:

  # ============================================================
  # Backend
  # ============================================================
  backend:
    name: Backend Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Test backend
        run: mvn -B test

      - name: Package backend
        run: mvn -B -DskipTests package


  # ============================================================
  # Web
  # ============================================================
  web:
    name: Web Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: pandora_web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pandora_web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build web
        run: npm run build


  # ============================================================
  # Docker Build Check
  # ============================================================
  docker:
    name: Docker Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose
        env:
          POSTGRES_DB: pandora
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_password

          SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pandora
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: ci_test_password

          ADMIN_INIT_PASSWORD: ci_admin_password
        run: docker compose config

      - name: Build backend image
        run: docker compose build backend

      - name: Build web image
        run: docker compose build web


  # ============================================================
  # Publish Docker Images
  # ============================================================
  publish:
    name: Publish Docker Images
    runs-on: ubuntu-latest

    needs:
      - backend
      - web
      - docker

    # Only publish images for direct pushes to devops/docker.
    # Pull requests only run CI checks.
    if: github.event_name == 'push' && github.ref == 'refs/heads/devops/docker'

    steps:
      - name: Checkout
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Login: GitHub Container Registry
      # --------------------------------------------------------
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # --------------------------------------------------------
      # Login: Huawei Cloud SWR
      # --------------------------------------------------------
      - name: Log in to Huawei Cloud SWR
        uses: docker/login-action@v3
        with:
          registry: swr.cn-north-4.myhuaweicloud.com
          username: ${{ secrets.SWR_USERNAME }}
          password: ${{ secrets.SWR_PASSWORD }}


      # --------------------------------------------------------
      # Backend Image
      # --------------------------------------------------------
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/wang0166/pandora-backend:devops-docker
            ghcr.io/wang0166/pandora-backend:${{ github.sha }}
            swr.cn-north-4.myhuaweicloud.com/pandora-zsq/pandora-backend:devops-docker
            swr.cn-north-4.myhuaweicloud.com/pandora-zsq/pandora-backend:${{ github.sha }}


      # --------------------------------------------------------
      # Web Image
      # --------------------------------------------------------
      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: ./pandora_web
          file: ./pandora_web/Dockerfile
          push: true
          tags: |
            ghcr.io/wang0166/pandora-web:devops-docker
            ghcr.io/wang0166/pandora-web:${{ github.sha }}
            swr.cn-north-4.myhuaweicloud.com/pandora-zsq/pandora-web:devops-docker
            swr.cn-north-4.myhuaweicloud.com/pandora-zsq/pandora-web:${{ github.sha }}