name: Pandora CI

on:
  push:
    branches:
      - devops/docker
  pull_request:
    branches:
      - devops/docker
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # ============================================================
  # Backend: test + package
  # ============================================================
  backend:
    name: Backend Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Test backend
        run: mvn -B test

      - name: Package backend
        run: mvn -B -DskipTests package


  # ============================================================
  # Frontend: install + build
  # ============================================================
  web:
    name: Web Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: pandora_web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pandora_web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build web
        run: npm run build


  # ============================================================
  # Docker: validate compose + verify images can build
  # ============================================================
  docker:
    name: Docker Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose
        env:
          POSTGRES_DB: pandora
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_password

          SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pandora
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: ci_test_password

          ADMIN_INIT_PASSWORD: ci_admin_password
        run: docker compose config

      - name: Build backend image
        run: docker compose build backend

      - name: Build web image
        run: docker compose build web


  # ============================================================
  # Publish: push backend/web images to GHCR + Huawei SWR
  # ============================================================
  publish:
    name: Publish Docker Images
    runs-on: ubuntu-latest

    needs:
      - backend
      - web
      - docker

    if: github.event_name == 'push' && github.ref == 'refs/heads/devops/docker'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Huawei Cloud SWR
        uses: docker/login-action@v3
        with:
          registry: swr.cn-north-4.myhuaweicloud.com
          username: ${{ secrets.SWR_USERNAME }}
          password: ${{ secrets.SWR_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/wang0166/pandora-backend:devops-docker
            ghcr.io/wang0166/pandora-backend:${{ github.sha }}
            swr.cn-north-4.myhuaweicloud.com/pandora-zsq/pandora-backend:devops-docker
            swr.cn-north-4.myhuaweicloud.com/pandora-zsq/pandora-backend:${{ github.sha }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: ./pandora_web
          file: ./pandora_web/Dockerfile
          push: true
          tags: |
            ghcr.io/wang0166/pandora-web:devops-docker
            ghcr.io/wang0166/pandora-web:${{ github.sha }}
            swr.cn-north-4.myhuaweicloud.com/pandora-zsq/pandora-web:devops-docker
            swr.cn-north-4.myhuaweicloud.com/pandora-zsq/pandora-web:${{ github.sha }}


  # ============================================================
  # Deploy: deploy exact commit SHA to Huawei ECS
  # ============================================================
  deploy:
    name: Deploy to ECS
    runs-on: ubuntu-latest

    needs:
      - publish

    if: github.event_name == 'push' && github.ref == 'refs/heads/devops/docker'

    steps:
      # --------------------------------------------------------
      # Configure SSH connection to ECS
      # --------------------------------------------------------
      - name: Configure SSH
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$ECS_SSH_KEY" > ~/.ssh/pandora_deploy_key
          chmod 600 ~/.ssh/pandora_deploy_key

          ssh-keyscan -H "$ECS_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # --------------------------------------------------------
      # Pull exact SHA images and recreate backend + web
      # PostgreSQL is intentionally not redeployed here
      # --------------------------------------------------------
      - name: Deploy Pandora
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USER }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/pandora_deploy_key \
            "$ECS_USER@$ECS_HOST" \
            "cd /opt/pandora && \
             IMAGE_TAG='$IMAGE_TAG' docker compose pull backend web && \
             IMAGE_TAG='$IMAGE_TAG' docker compose up -d --no-deps backend web && \
             docker compose ps"

      # --------------------------------------------------------
      # Verify deployment
      #
      # Web:
      #   must return HTTP 200
      #
      # API:
      #   Pandora currently returns HTTP 401 for /api/ without
      #   an access token. That is acceptable and proves that
      #   Nginx can reach the backend.
      #
      #   HTTP 502 or 000 means backend connectivity failed.
      # --------------------------------------------------------
      - name: Verify deployment
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USER }}
        run: |
          ssh -i ~/.ssh/pandora_deploy_key \
            "$ECS_USER@$ECS_HOST" '
              set -e

              cd /opt/pandora

              echo "Waiting for Pandora to start..."

              for i in $(seq 1 12); do
                HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost || true)

                if [ "$HTTP_CODE" = "200" ]; then
                  echo "Web health check passed."
                  break
                fi

                if [ "$i" = "12" ]; then
                  echo "Web health check failed."
                  echo "Container status:"
                  docker compose ps

                  echo "Web logs:"
                  docker compose logs --tail=100 web

                  echo "Backend logs:"
                  docker compose logs --tail=100 backend

                  exit 1
                fi

                echo "Attempt $i/12: HTTP $HTTP_CODE, retrying in 5 seconds..."
                sleep 5
              done

              echo "Checking backend through Nginx..."

              API_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/api/ || true)

              if [ "$API_CODE" = "502" ] || [ "$API_CODE" = "000" ]; then
                echo "Backend health check failed: HTTP $API_CODE"

                echo "Container status:"
                docker compose ps

                echo "Backend logs:"
                docker compose logs --tail=100 backend

                exit 1
              fi

              echo "Backend is reachable through Nginx: HTTP $API_CODE"
              echo "Pandora deployment verified successfully."
            '